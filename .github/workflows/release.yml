name: Release - Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 2.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Validate release version
        run: |
          if [[ "${{ github.ref_name }}" != "master" ]]; then
            echo "Release workflow must run from master (current: ${{ github.ref_name }})"
            exit 1
          fi

          POM_VERSION=$(./mvnw -B help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "Requested version: ${{ inputs.version }}"
          echo "POM version:       $POM_VERSION"

          if [[ "$POM_VERSION" == *SNAPSHOT* ]]; then
            echo "The POM version is a SNAPSHOT. Bump it to the release version and commit before releasing."
            exit 1
          fi

          if [[ "$POM_VERSION" != "${{ inputs.version }}" ]]; then
            echo "The requested version does not match the POM version."
            exit 1
          fi

      - name: Validate Sonatype credentials
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "$SONATYPE_USERNAME" || -z "$SONATYPE_PASSWORD" ]]; then
            echo "::error::SONATYPE_USERNAME and SONATYPE_PASSWORD must be set."
            exit 1
          fi

          TOKEN=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')
          URL="https://central.sonatype.com/api/v1/publisher/published?namespace=io.github.thanglequoc&name=aqi-calculator&version=${RELEASE_VERSION}"

          STATUS=$(curl -sS -o /tmp/sonatype-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$URL" || true)

          echo "Central Portal credential check returned HTTP $STATUS"

          if [[ "$STATUS" == "401" || "$STATUS" == "403" ]]; then
            cat /tmp/sonatype-check.json || true
            echo "::error::Central Portal rejected the credentials. Use the user token username/password from https://central.sonatype.com/usertoken."
            exit 1
          fi

          if [[ "$STATUS" == "000" ]]; then
            echo "::error::Could not reach the Central Portal API."
            exit 1
          fi

      - name: Build and test
        run: ./mvnw -B clean verify

      - name: Stage artifacts
        run: ./mvnw -B -Ppublication -DskipTests

      - name: Validate JReleaser configuration
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GITHUB_USERNAME: ${{ github.actor }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./mvnw -B jreleaser:config

      - name: Full release with JReleaser
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GITHUB_USERNAME: ${{ github.actor }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./mvnw -B jreleaser:full-release

      - name: Upload release output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-output
          path: |
            target/jreleaser/
            target/staging-deploy/
